        <div class="contenedor">

         
          <section class="panel-docentes">

            <h2>Docentes registrados</h2>

            <div class="barra-acciones">

              <div *ngIf="mostrarFormulario" class="formulario-docente">

                <h3>{{ modoEdicion ? 'Editar Docente' : 'Nuevo Docente' }}</h3>

                <!-- CAMPOS IGUALES (los dejo igual porque ya funcionan) -->

                <label>Apellido</label>
    <input
        type="text"
        [(ngModel)]="nuevoDocente.apellido">

    <label>Nombre</label>
    <input
        type="text"
        [(ngModel)]="nuevoDocente.nombre">

    <label>DNI</label>
    <input
        type="text"
        [(ngModel)]="nuevoDocente.dni">

    <label>Dirección</label>
    <input
        type="text"
        [(ngModel)]="nuevoDocente.direccion">

    <label>Cargo</label>
    <input
        type="text"
        [(ngModel)]="nuevoDocente.cargo">

    <label>Correo</label>
    <input
        type="email"
        [(ngModel)]="nuevoDocente.correo">

    <label>Teléfono</label>
    <input
        type="text"
        [(ngModel)]="nuevoDocente.telefono">

    <label>Fecha de nacimiento</label>
    <input
        type="date"
        [(ngModel)]="nuevoDocente.fechaNacimiento">

    <br><br>

    <button
        class="btn-guardar"
        (click)="guardarDocente()">

        💾 Guardar

    </button>

    <button
        class="btn-eliminar"
        (click)="cancelarFormulario()">

        Cancelar

    </button>

              </div>

              <button class="btn-nuevo"
                      (click)="abrirFormulario()"
                      [disabled]="!botonNuevoHabilitado">

                + Nuevo Docente

              </button>

            </div>

            <input type="text"
                   placeholder="Buscar por DNI, nombre o apellido"
                   [(ngModel)]="filtroBusqueda"
                   (input)="filtrarDocentes()">

            <table>

              <thead>
                <tr>
                  <th>ID</th>
                  <th>Apellido</th>
                  <th>Nombre</th>
                  <th>DNI</th>
                  <th>Cargo</th>
                  <th>Acciones</th>
                </tr>
              </thead>

              <tbody>

                <tr *ngFor="let docente of docentesFiltrados">

                  <td>{{ docente.id }}</td>
                  <td>{{ docente.apellido }}</td>
                  <td>{{ docente.nombre }}</td>
                  <td>{{ docente.dni }}</td>
                  <td>{{ docente.cargo }}</td>

                  <td>
                    <button class="btn-editar" (click)="editarDocente(docente)">✏️</button>
                    <button class="btn-eliminar" (click)="eliminarDocente(docente)">🗑</button>
                  </td>

                </tr>

              </tbody>

            </table>

          </section>

        </div>
