<div class="panel-usuarios">

  <h2>👥 Gestión de Usuarios</h2>

  <div class="filtros">

    <input
      type="text"
      placeholder="Buscar usuario..."
      [(ngModel)]="filtro"
      (input)="filtrar()">

    <button
      class="btn-nuevo"
      (click)="nuevo()">

      + Nuevo Usuario

    </button>

  </div>

  <div
    *ngIf="mostrarFormulario"
    class="formulario">

    <h3>

      {{ editando
          ? 'Editar Usuario'
          : 'Nuevo Usuario' }}

    </h3>
<div class="campo-formulario">

  <label>Usuario <span class="text-danger">*</span></label>

  <input
      type="text"
      class="form-control"
      placeholder="Ej.: admin"
      [(ngModel)]="usuarioActual.username">

</div>

<div class="campo-formulario">

  <label>Nombre <span class="text-danger">*</span></label>

  <input
      type="text"
      class="form-control"
      placeholder="Ej.: Ricardo"
      [(ngModel)]="usuarioActual.nombre">

</div>

<div class="campo-formulario">

  <label>Apellido <span class="text-danger">*</span></label>

  <input
      type="text"
      class="form-control"
      placeholder="Ej.: Dal Lago"
      [(ngModel)]="usuarioActual.apellido">

</div>

<div class="campo-formulario">

  <label>Correo electrónico <span class="text-danger">*</span></label>

  <input
      type="email"
       autocomplete="off"
      class="form-control"
      placeholder="Ej.: usuario@ifd.edu.ar"
      [(ngModel)]="usuarioActual.email">

</div>

<div class="campo-formulario">

  <label>Contraseña <span class="text-danger">*</span></label>

  <input
    type="password"
    autocomplete="new-password"
    class="form-control"
    placeholder="Ingrese la contraseña"
    [(ngModel)]="usuarioActual.password">
</div>

<div class="campo-formulario">

  <label>Rol <span class="text-danger">*</span></label>

  <select
      class="form-select"
      [(ngModel)]="usuarioActual.rol">

      <option value="ADMIN">
        Administrador
      </option>

      <option value="SECRETARIO">
        Secretario
      </option>

  </select>

</div>

    <div class="acciones-formulario">

      <button
        (click)="guardar()">

        💾 Guardar

      </button>

      <button
        class="btn-cancelar"
        (click)="cancelar()">

        ❌ Cancelar

      </button>

    </div>

  </div>

  <table>

    <thead>

      <tr>

        <th>Usuario</th>
        <th>Nombre</th>
        <th>Apellido</th>
        <th>Email</th>
        <th>Rol</th>
        <th>Estado</th>
        <th>Docente</th>
        <th>Acciones</th>

      </tr>

    </thead>

    <tbody>

      <tr
        *ngFor="
          let u of usuariosFiltrados
        ">

        <td>{{ u.username }}</td>

        <td>{{ u.nombre }}</td>

        <td>{{ u.apellido }}</td>

        <td>{{ u.email }}</td>

        <td>{{ u.rol }}</td>

       <td>

          <span
            [ngClass]="
              u.activo
                ? 'activo'
                : 'inactivo'
            ">

            {{ u.activo
                ? 'Activo'
                : 'Inactivo' }}

          </span>

</td>

    

        <td>

          {{ u.docenteNombre || '-' }}

        </td>

        <td>

          <button
            class="btn-editar"
            (click)="editar(u)">

            ✏️

          </button>

          <button
    *ngIf="u.activo"
    class="btn-eliminar"
    (click)="desactivar(u)">
    🚫
  </button>

  <button
    *ngIf="!u.activo"
    class="btn-activar"
    (click)="activar(u)">
    ✅
  </button>

        </td>

      </tr>

    </tbody>

  </table>

</div>
